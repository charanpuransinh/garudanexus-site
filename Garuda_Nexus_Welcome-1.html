<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050914">
<title>Welcome to Garuda Nexus | Global Trading System</title>
<style>
:root{--gold:#e8ad4b;--gold2:#ffe2a0;--ink:#050914;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 42%,#172036 0%,#080e1c 48%,#02040a 100%);color:#fff;font-family:Georgia,'Noto Serif Devanagari',serif;overflow-x:hidden}
body{min-height:100vh;display:grid;place-items:center;position:relative;isolation:isolate}
body:before{content:"";position:fixed;inset:0;z-index:-2;background-image:radial-gradient(1px 1px at 12% 18%,#fff 99%,transparent),radial-gradient(1px 1px at 77% 28%,#d7c7a2 99%,transparent),radial-gradient(1px 1px at 32% 78%,#fff 99%,transparent),radial-gradient(1px 1px at 88% 83%,#fff 99%,transparent),radial-gradient(1px 1px at 55% 12%,#fff 99%,transparent);background-size:230px 210px;opacity:.65}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(232,173,75,.08),transparent 15%,transparent 85%,rgba(232,173,75,.08))}
.corner{position:fixed;width:clamp(58px,9vw,112px);height:auto;opacity:.24;filter:drop-shadow(0 0 9px #d58c2d);z-index:2;pointer-events:none;animation:cornerGlow 5s ease-in-out infinite}
.tl{top:10px;left:10px} .tr{top:10px;right:10px;transform:scaleX(-1)}
.bl{bottom:10px;left:10px;transform:scaleY(-1)} .br{bottom:10px;right:10px;transform:scale(-1)}
.wrap{width:min(94vw,900px);padding:clamp(24px,5vw,54px) 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,18px)}
.welcome{font-family:Arial,sans-serif;font-size:clamp(13px,2.4vw,20px);letter-spacing:.42em;color:#f5d89f;text-transform:uppercase;opacity:0;animation:fadeUp 1s .3s forwards}
.hero{width:min(74vw,500px);aspect-ratio:1/1;object-fit:contain;filter:drop-shadow(0 0 22px rgba(255,166,48,.55));opacity:0;transform:translateY(115px) scale(.55) rotate(-9deg);animation:garudaFlight 2.2s .65s cubic-bezier(.16,.8,.2,1) forwards}
.brand{font-size:clamp(34px,7.4vw,72px);line-height:1.05;letter-spacing:.055em;font-weight:700;color:var(--gold2);text-shadow:0 2px 0 #6d3510,0 0 24px rgba(255,166,48,.25);opacity:0;animation:fadeUp 1.1s 2.1s forwards}
.subtitle{font-family:Arial,sans-serif;font-size:clamp(13px,2.5vw,22px);letter-spacing:.22em;color:#f2d7a4;opacity:0;animation:fadeUp 1s 2.45s forwards}
.rule{width:min(260px,55vw);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:8px 0;opacity:0;animation:fadeUp 1s 2.7s forwards}
.trident{font-size:clamp(34px,5vw,48px);line-height:1;color:#e8ad4b;text-shadow:0 0 18px rgba(255,174,62,.65);opacity:0;animation:fadeUp 1s 2.8s forwards}
.motto{font-size:clamp(17px,3.3vw,25px);color:#f1d4a0;letter-spacing:.06em;opacity:0;animation:fadeUp 1s 3s forwards}
.enter{margin-top:15px;padding:12px 28px;border:1px solid rgba(232,173,75,.75);border-radius:3px;background:rgba(12,17,29,.55);color:#ffe2a0;letter-spacing:.18em;font:600 12px Arial,sans-serif;text-decoration:none;opacity:0;animation:fadeUp 1s 3.4s forwards;transition:.25s}
.enter:hover{background:rgba(232,173,75,.16);box-shadow:0 0 22px rgba(232,173,75,.25);transform:translateY(-2px)}
@keyframes garudaFlight{0%{opacity:0;transform:translateY(115px) scale(.55) rotate(-9deg)}55%{opacity:1;transform:translateY(-12px) scale(1.04) rotate(2deg)}78%{transform:translateY(5px) scale(.98) rotate(-1deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes cornerGlow{0%,100%{opacity:.17}50%{opacity:.34}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important;transition:none!important}}
@media(max-width:480px){.corner{width:58px;opacity:.16}.wrap{gap:12px}.hero{width:min(82vw,390px)}.brand{letter-spacing:.025em}.subtitle{letter-spacing:.12em}}
</style>
</head>
